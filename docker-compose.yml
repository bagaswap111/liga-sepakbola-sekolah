version: '3.9'

services:
  liga_db:
    image: postgres:16-alpine
    container_name: liga_db
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-liga_jateng}
    volumes:
      - liga_postgres_data:/var/lib/postgresql/data
    networks:
      - liga_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liga_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: liga_db
      DB_PORT: 5432
    volumes:
      - liga_uploads:/app/uploads
    ports:
      - "127.0.0.1:4200:5000"
    depends_on:
      liga_db:
        condition: service_healthy
    networks:
      - liga_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: liga_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:80"
    depends_on:
      - backend
    networks:
      - liga_net

volumes:
  liga_postgres_data:
  liga_uploads:

networks:
  liga_net:
    driver: bridge
