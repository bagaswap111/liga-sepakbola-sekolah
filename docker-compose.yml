version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: liga_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-liga_jateng}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - liga_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liga_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - liga_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: liga_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - liga_net

volumes:
  postgres_data:
  uploads_data:

networks:
  liga_net:
    driver: bridge
